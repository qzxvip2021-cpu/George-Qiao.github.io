name: R2-C Browser QA (test-only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [v2/integration, main]
    paths:
      - _config.yml
      - index.html
      - 'assets/**'
      - 'projects/**'
      - tests/r2c-browser-qa.cjs
      - .github/workflows/r2c-browser-qa.yml

permissions:
  contents: read

jobs:
  browser-qa:
    name: V2 Chromium root/subpath smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Execute R2-C browser smoke matrix
        env:
          R2C_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tests/r2c-browser-qa.cjs
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2c-browser-qa-screenshots
          path: qa-artifacts/r2c/
          if-no-files-found: ignore
          retention-days: 7

  pages-surface-qa:
    name: Jekyll output excludes internal QA/docs (build-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build GitHub Pages output (no deployment)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify public pages kept and internal directories excluded
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            _site/index.html \
            _site/projects/v4-flight-computer/index.html \
            _site/projects/thunder-v2-hpr-flight/index.html \
            _site/projects/thunder-v2-flight-evidence/index.html \
            _site/assets/css/style.css \
            _site/assets/js/script.js \
            _site/assets/projects/thunder-v2/thunder-v2-nose-cone.jpg \
            _site/assets/projects/thunder-v2/launch-event-team.jpg; do
            test -f "$file" || { echo "::error::Missing public file: $file"; exit 1; }
          done
          for path in _site/tests _site/docs _site/projects/_template; do
            test ! -e "$path" || { echo "::error::Internal material in output: $path"; exit 1; }
          done
          echo "PASS: public pages/assets retained; QA and authoring files excluded"
